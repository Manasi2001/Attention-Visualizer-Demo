<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Attention Tree Visualizer</title>
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <style>
        body { font-family: Arial, sans-serif; display: flex; flex-direction: column; align-items: center; background-color: #ffffff; padding: 20px; }
        #controls { margin-bottom: 20px; }
        select { padding: 8px 12px; font-size: 16px; border-radius: 4px; border: 1px solid #ccc; }
        svg { border: 1px solid #eee; border-radius: 8px; background-color: #fafafa; }
    </style>
</head>
<body>

    <div id="controls">
        <label for="wordSelect"><strong>Select Target Word: </strong></label>
        <select id="wordSelect"></select>
    </div>

    <svg width="600" height="500"></svg>

    <script>
        const words = ["The", "lady", "sits", "on", "a", "chair."];
        
        // Simulated conceptual attention weights (Source Word -> [Weights to other words])
        const dummyWeights = {
            "The": [1.0, 0.8, 0.1, 0.05, 0.0, 0.05],
            "lady": [0.6, 1.0, 0.7, 0.1, 0.0, 0.1],
            "sits": [0.05, 0.6, 1.0, 0.8, 0.1, 0.3],
            "on": [0.0, 0.1, 0.8, 1.0, 0.6, 0.7],
            "a": [0.0, 0.0, 0.1, 0.4, 1.0, 0.9],
            "chair.": [0.0, 0.1, 0.3, 0.7, 0.8, 1.0]
        };

        const select = d3.select("#wordSelect");
        select.selectAll("option")
            .data(words)
            .enter()
            .append("option")
            .text(d => d)
            .attr("value", d => d);

        const svg = d3.select("svg"),
              width = +svg.attr("width"),
              height = +svg.attr("height"),
              centerX = width / 2,
              centerY = height / 2;

        const g = svg.append("g");

        function updateViz(selectedWord) {
            g.selectAll("*").remove(); // Clear previous drawing

            const selectedIndex = words.indexOf(selectedWord);
            const weights = dummyWeights[selectedWord];
            const radius = 180;

            // Create nodes data
            const nodesData = words.map((word, i) => {
                if (word === selectedWord) return { id: word, x: centerX, y: centerY, weight: 1, isRoot: true };
                
                // Distribute children in a circle
                const angle = (i / (words.length - 1)) * 2 * Math.PI;
                return {
                    id: word,
                    x: centerX + radius * Math.cos(angle),
                    y: centerY + radius * Math.sin(angle),
                    weight: weights[i],
                    isRoot: false
                };
            });

            // Draw Links
            g.selectAll("line")
                .data(nodesData.filter(d => !d.isRoot))
                .enter().append("line")
                .attr("x1", centerX)
                .attr("y1", centerY)
                .attr("x2", d => d.x)
                .attr("y2", d => d.y)
                .attr("stroke", d => d3.interpolateBlues(d.weight))
                .attr("stroke-width", d => Math.max(1, d.weight * 10))
                .attr("opacity", 0.7);

            // Draw Nodes
            const nodes = g.selectAll("g")
                .data(nodesData)
                .enter().append("g")
                .attr("transform", d => `translate(${d.x},${d.y})`);

            nodes.append("circle")
                .attr("r", d => d.isRoot ? 35 : 15 + (d.weight * 20))
                .attr("fill", d => d.isRoot ? "#ff7f0e" : d3.interpolateBlues(d.weight))
                .attr("stroke", "#333")
                .attr("stroke-width", 2);

            nodes.append("text")
                .text(d => d.id)
                .attr("dy", d => d.isRoot ? 5 : d.weight > 0.5 ? 5 : 25)
                .attr("text-anchor", "middle")
                .attr("font-size", d => d.isRoot ? "18px" : `${12 + (d.weight * 8)}px`)
                .attr("font-weight", d => d.weight > 0.5 ? "bold" : "normal")
                .attr("fill", d => (d.isRoot || d.weight > 0.6) ? "#fff" : "#333");
        }

        // Initialize
        updateViz(words[0]);

        // Listen for changes
        select.on("change", function() {
            updateViz(this.value);
        });
    </script>
</body>
</html>
