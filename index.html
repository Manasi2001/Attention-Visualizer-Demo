<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Attention Flow Visualizer</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://d3js.org/d3.v7.min.js"></script>

<style>
body {
  font-family: 'Inter', sans-serif;
  margin: 0;
  background: #f8fafc;
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 40px 20px;
}

h2 {
  margin-bottom: 10px;
}

#controls {
  margin-bottom: 25px;
}

select {
  padding: 8px 12px;
  border-radius: 6px;
  border: 1px solid #ccc;
}

svg {
  background: white;
  border-radius: 12px;
  box-shadow: 0 10px 25px rgba(0,0,0,0.08);
}

.node rect {
  rx: 8;
  ry: 8;
}

</style>
</head>

<body>

<h2>Attention Flow</h2>

<div id="controls">
  <label>Select word:</label>
  <select id="wordSelect"></select>
</div>

<svg width="800" height="400"></svg>

<script>
const words = ["The", "lady", "sits", "on", "a", "chair."];

const dummyWeights = {
  "The": [1.0, 0.85, 0.1, 0.05, 0.0, 0.05],
  "lady": [0.65, 1.0, 0.75, 0.1, 0.0, 0.1],
  "sits": [0.05, 0.7, 1.0, 0.8, 0.1, 0.3],
  "on": [0.0, 0.1, 0.85, 1.0, 0.6, 0.75],
  "a": [0.0, 0.0, 0.1, 0.4, 1.0, 0.9],
  "chair.": [0.0, 0.1, 0.3, 0.7, 0.9, 1.0]
};

const svg = d3.select("svg");
const width = +svg.attr("width");
const height = +svg.attr("height");

const g = svg.append("g");

const select = d3.select("#wordSelect");
select.selectAll("option")
  .data(words)
  .enter()
  .append("option")
  .text(d => d);

const xSpacing = width / (words.length + 1);
const sourceY = 100;
const targetY = 280;

function update(selectedWord) {
  g.selectAll("*").remove();

  const weights = dummyWeights[selectedWord];

  // SOURCE NODE
  g.append("rect")
    .attr("x", width / 2 - 60)
    .attr("y", sourceY - 20)
    .attr("width", 120)
    .attr("height", 40)
    .attr("fill", "#2563eb");

  g.append("text")
    .attr("x", width / 2)
    .attr("y", sourceY + 5)
    .attr("text-anchor", "middle")
    .attr("fill", "white")
    .attr("font-weight", "600")
    .text(selectedWord);

  // TARGET NODES
  words.forEach((word, i) => {
    const x = (i + 1) * xSpacing;

    const weight = weights[i];

    // line
    g.append("line")
      .attr("x1", width / 2)
      .attr("y1", sourceY + 20)
      .attr("x2", x)
      .attr("y2", targetY - 20)
      .attr("stroke", "#2563eb")
      .attr("stroke-width", 1 + weight * 6)
      .attr("opacity", 0.2 + weight * 0.8);

    // box
    g.append("rect")
      .attr("x", x - 50)
      .attr("y", targetY - 20)
      .attr("width", 100)
      .attr("height", 40)
      .attr("fill", "#e5e7eb");

    // text
    g.append("text")
      .attr("x", x)
      .attr("y", targetY + 5)
      .attr("text-anchor", "middle")
      .attr("font-size", "13px")
      .text(word);

    // weight label (small but useful)
    g.append("text")
      .attr("x", x)
      .attr("y", targetY + 30)
      .attr("text-anchor", "middle")
      .attr("font-size", "11px")
      .attr("fill", "#6b7280")
      .text(weight.toFixed(2));
  });
}

update(words[0]);

select.on("change", function() {
  update(this.value);
});

</script>

</body>
</html>
