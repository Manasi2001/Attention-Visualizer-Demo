<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Attention Mechanism Explorer</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://d3js.org/d3.v7.min.js"></script>

<style>
body {
  font-family: 'Inter', sans-serif;
  margin: 0;
  background: linear-gradient(135deg, #eef2ff, #f8fafc);
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 40px 20px;
  color: #111827;
}

.header-container {
  text-align: center;
  margin-bottom: 25px;
}

h2 {
  margin: 0;
  font-size: 28px;
  font-weight: 700;
}

.subtitle {
  margin-top: 8px;
  color: #6b7280;
  font-size: 15px;
}

#controls {
  background: rgba(255, 255, 255, 0.9);
  backdrop-filter: blur(10px);
  padding: 12px 20px;
  border-radius: 12px;
  box-shadow: 0 8px 20px rgba(0,0,0,0.08);
  margin-bottom: 25px;
}

label {
  font-weight: 600;
  margin-right: 10px;
}

select {
  padding: 8px 14px;
  border-radius: 8px;
  border: 1px solid #d1d5db;
  background: #f9fafb;
  font-size: 14px;
  cursor: pointer;
}

svg {
  background: white;
  border-radius: 18px;
  box-shadow: 0 20px 40px rgba(0,0,0,0.1);
}

.node circle {
  transition: all 0.3s ease;
}

.node:hover circle {
  transform: scale(1.05);
}

</style>
</head>

<body>

<div class="header-container">
  <h2>Attention Mechanism Explorer</h2>
  <div class="subtitle">Visualizing how each word attends to others</div>
</div>

<div id="controls">
  <label for="wordSelect">Focus word:</label>
  <select id="wordSelect"></select>
</div>

<svg width="700" height="600"></svg>

<script>
const words = ["The", "lady", "sits", "on", "a", "chair."];

const dummyWeights = {
  "The": [1.0, 0.85, 0.1, 0.05, 0.0, 0.05],
  "lady": [0.65, 1.0, 0.75, 0.1, 0.0, 0.1],
  "sits": [0.05, 0.7, 1.0, 0.8, 0.1, 0.3],
  "on": [0.0, 0.1, 0.85, 1.0, 0.6, 0.75],
  "a": [0.0, 0.0, 0.1, 0.4, 1.0, 0.9],
  "chair.": [0.0, 0.1, 0.3, 0.7, 0.9, 1.0]
};

const select = d3.select("#wordSelect");
select.selectAll("option")
  .data(words)
  .enter()
  .append("option")
  .text(d => d);

const svg = d3.select("svg"),
      width = +svg.attr("width"),
      height = +svg.attr("height"),
      centerX = width / 2,
      centerY = height / 2;

const g = svg.append("g");

const colorScale = d3.scaleLinear()
  .domain([0, 1])
  .range(["#c7d2fe", "#1e3a8a"]);

function updateViz(selectedWord) {
  g.selectAll("*").remove();

  const weights = dummyWeights[selectedWord];
  const radius = 220;

  const nodesData = words.map((word, i) => {
    if (word === selectedWord) {
      return { id: word, x: centerX, y: centerY, weight: 1, root: true };
    }

    const angle = (i / words.length) * 2 * Math.PI;
    return {
      id: word,
      x: centerX + radius * Math.cos(angle),
      y: centerY + radius * Math.sin(angle),
      weight: weights[i],
      root: false
    };
  });

  // LINKS
  g.selectAll("line")
    .data(nodesData.filter(d => !d.root))
    .enter()
    .append("line")
    .attr("x1", centerX)
    .attr("y1", centerY)
    .attr("x2", d => d.x)
    .attr("y2", d => d.y)
    .attr("stroke", d => colorScale(d.weight))
    .attr("stroke-width", d => 1 + d.weight * 6)
    .attr("opacity", d => 0.3 + d.weight * 0.7);

  // NODES
  const nodes = g.selectAll(".node")
    .data(nodesData)
    .enter()
    .append("g")
    .attr("class", "node")
    .attr("transform", d => `translate(${d.x},${d.y})`);

  nodes.append("circle")
    .attr("r", d => d.root ? 50 : 10 + d.weight * 20)
    .attr("fill", d => d.root ? "#2563eb" : colorScale(d.weight))
    .attr("stroke", "white")
    .attr("stroke-width", 2);

  nodes.append("text")
    .text(d => d.id)
    .attr("text-anchor", "middle")
    .attr("dy", d => d.root ? "0.35em" : (20 + d.weight * 20))
    .attr("font-size", d => d.root ? "20px" : "13px")
    .attr("font-weight", d => d.root ? "700" : "500")
    .attr("fill", d => d.root ? "white" : "#374151")
    .clone(true)
    .lower()
    .attr("stroke", "white")
    .attr("stroke-width", 3);
}

updateViz(words[0]);

select.on("change", function() {
  updateViz(this.value);
});
</script>

</body>
</html>
